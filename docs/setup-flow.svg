<svg width="680" height="700" viewBox="0 0 680 700" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Project setup process</title>
  <desc>Flowchart showing the steps to set up a Python API project before writing any script.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#6B6B6B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .label-sub { font-size: 12px; fill: #555; }
      .label-title { font-size: 14px; font-weight: 600; fill: #1a1a1a; }
      .caption { font-size: 12px; fill: #888; }
      .legend-label { font-size: 12px; fill: #444; }
      .connector { stroke: #9CA3AF; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
      .connector-dashed { stroke: #C4C4C4; stroke-width: 1.2; fill: none; stroke-dasharray: 5 4; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="680" height="700" fill="#ffffff"/>

  <!-- Caption -->
  <text class="caption" x="340" y="26" text-anchor="middle">One-time setup before writing any script</text>

  <!-- Step 1: Create folder — teal -->
  <rect x="200" y="40" width="280" height="50" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text class="label-title" x="340" y="62" text-anchor="middle">Create project folder</text>
  <text class="label-sub" x="340" y="79" text-anchor="middle">mkdir · cd · code . to open in VS Code</text>
  <line x1="340" y1="90" x2="340" y2="118" class="connector"/>

  <!-- Step 2: Git init — teal -->
  <rect x="200" y="120" width="280" height="50" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text class="label-title" x="340" y="142" text-anchor="middle">Initialise Git repo</text>
  <text class="label-sub" x="340" y="159" text-anchor="middle">git init · git add . · git commit</text>
  <line x1="340" y1="170" x2="340" y2="198" class="connector"/>

  <!-- Step 3: Push to GitHub — teal -->
  <rect x="200" y="200" width="280" height="50" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text class="label-title" x="340" y="222" text-anchor="middle">Push to GitHub</text>
  <text class="label-sub" x="340" y="239" text-anchor="middle">git remote add origin · git push -u origin main</text>
  <line x1="340" y1="250" x2="340" y2="278" class="connector"/>

  <!-- Step 4: Create venv — purple -->
  <rect x="200" y="280" width="280" height="50" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text class="label-title" x="340" y="302" text-anchor="middle" fill="#26215C">Create virtual environment</text>
  <text class="label-sub" x="340" y="319" text-anchor="middle" fill="#534AB7">python3 -m venv .venv · source .venv/bin/activate</text>
  <line x1="340" y1="330" x2="340" y2="358" class="connector"/>

  <!-- Step 5: Install packages — purple -->
  <rect x="200" y="360" width="280" height="50" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text class="label-title" x="340" y="382" text-anchor="middle" fill="#26215C">Install packages</text>
  <text class="label-sub" x="340" y="399" text-anchor="middle" fill="#534AB7">pip install · pip freeze > requirements.txt</text>
  <line x1="340" y1="410" x2="340" y2="438" class="connector"/>

  <!-- Step 6: .env — coral -->
  <rect x="200" y="440" width="280" height="50" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text class="label-title" x="340" y="462" text-anchor="middle" fill="#4A1B0C">Create .env file</text>
  <text class="label-sub" x="340" y="479" text-anchor="middle" fill="#993C1D">touch .env · add API and AWS credentials</text>
  <line x1="340" y1="490" x2="340" y2="518" class="connector"/>

  <!-- Step 7: .gitignore — coral -->
  <rect x="200" y="520" width="280" height="50" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text class="label-title" x="340" y="542" text-anchor="middle" fill="#4A1B0C">Create .gitignore file</text>
  <text class="label-sub" x="340" y="559" text-anchor="middle" fill="#993C1D">add .env .venv output/ logs/ temp/</text>
  <line x1="340" y1="570" x2="340" y2="598" class="connector"/>

  <!-- End -->
  <rect x="210" y="598" width="260" height="26" rx="6" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
  <text class="label-sub" x="340" y="615" text-anchor="middle" fill="#444441">Ready to write main.py and modules</text>

  <!-- Legend -->
  <rect x="100" y="645" width="12" height="12" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text class="legend-label" x="118" y="655">Git / project structure</text>
  <rect x="280" y="645" width="12" height="12" rx="3" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text class="legend-label" x="298" y="655">Python environment</text>
  <rect x="450" y="645" width="12" height="12" rx="3" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text class="legend-label" x="468" y="655">Secrets / config</text>
</svg>
