<svg width="680" height="570" viewBox="0 0 680 570" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Amplitude load process</title>
  <desc>Flowchart showing the steps to load extracted JSON files into AWS S3.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#6B6B6B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .label-sub { font-size: 12px; fill: #555; }
      .label-title { font-size: 14px; font-weight: 600; fill: #1a1a1a; }
      .caption { font-size: 12px; fill: #888; }
      .fail-label { font-size: 11px; fill: #aaa; }
      .loop-label { font-size: 11px; fill: #aaa; }
      .connector { stroke: #9CA3AF; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
      .connector-dashed { stroke: #C4C4C4; stroke-width: 1.2; fill: none; stroke-dasharray: 5 4; }
    </style>
  </defs>

  <rect width="680" height="570" fill="#ffffff"/>

  <!-- Caption -->
  <text class="caption" x="340" y="26" text-anchor="middle">main.py calls loadJson() after successful extract</text>

  <!-- Step 1: Validate credentials — purple -->
  <rect x="200" y="40" width="280" height="50" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text class="label-title" x="340" y="62" text-anchor="middle" fill="#26215C">Validate AWS credentials</text>
  <text class="label-sub" x="340" y="79" text-anchor="middle" fill="#534AB7">AWS_KEY_ID + AWS_SECRET_KEY from .env</text>

  <!-- Fail branch -->
  <path d="M480 65 L560 65 L560 492 L482 492" class="connector-dashed" marker-end="none"/>
  <line x1="560" y1="492" x2="484" y2="492" stroke="#C4C4C4" stroke-width="1.2" fill="none" marker-end="url(#arrow)"/>
  <text class="fail-label" x="568" y="275">missing</text>
  <text class="fail-label" x="568" y="289">→ log error</text>

  <line x1="340" y1="90" x2="340" y2="118" class="connector"/>

  <!-- Step 2: Configure S3 — coral -->
  <rect x="200" y="120" width="280" height="50" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text class="label-title" x="340" y="142" text-anchor="middle" fill="#4A1B0C">Configure S3 client</text>
  <text class="label-sub" x="340" y="159" text-anchor="middle" fill="#993C1D">boto3.client('s3', key, secret)</text>
  <line x1="340" y1="170" x2="340" y2="198" class="connector"/>

  <!-- Step 3: Glob files — coral -->
  <rect x="200" y="200" width="280" height="50" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text class="label-title" x="340" y="222" text-anchor="middle" fill="#4A1B0C">Find JSON files in output/</text>
  <text class="label-sub" x="340" y="239" text-anchor="middle" fill="#993C1D">data_dir.glob('*.json')</text>
  <line x1="340" y1="250" x2="340" y2="278" class="connector"/>

  <!-- Step 4: Loop — purple -->
  <rect x="200" y="280" width="280" height="50" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text class="label-title" x="340" y="302" text-anchor="middle" fill="#26215C">Loop through each file</text>
  <text class="label-sub" x="340" y="319" text-anchor="middle" fill="#534AB7">try/except per file — errors don't stop loop</text>
  <line x1="340" y1="330" x2="340" y2="358" class="connector"/>

  <!-- Step 5: Upload — coral -->
  <rect x="200" y="360" width="280" height="50" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text class="label-title" x="340" y="382" text-anchor="middle" fill="#4A1B0C">Upload file to S3</text>
  <text class="label-sub" x="340" y="399" text-anchor="middle" fill="#993C1D">s3_client.upload_file() → BUCKET_OBJECT/file</text>
  <line x1="340" y1="410" x2="340" y2="438" class="connector"/>

  <!-- Step 6: Verify + delete — coral -->
  <rect x="200" y="440" width="280" height="50" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text class="label-title" x="340" y="462" text-anchor="middle" fill="#4A1B0C">Verify in S3 · delete local copy</text>
  <text class="label-sub" x="340" y="479" text-anchor="middle" fill="#993C1D">head_object() · os.remove()</text>

  <!-- Loop back arrow -->
  <path d="M200 465 L140 465 L140 305 L200 305" class="connector-dashed" marker-end="none"/>
  <line x1="140" y1="305" x2="198" y2="305" stroke="#C4C4C4" stroke-width="1.2" fill="none" marker-end="url(#arrow)"/>
  <text class="loop-label" x="75" y="389" text-anchor="middle">next</text>
  <text class="loop-label" x="75" y="403" text-anchor="middle">file</text>

  <line x1="340" y1="490" x2="340" y2="518" class="connector"/>

  <!-- End -->
  <rect x="210" y="518" width="260" height="26" rx="6" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
  <text class="label-sub" x="340" y="535" text-anchor="middle" fill="#444441">Log total files uploaded → done</text>
</svg>
